on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
      - "copilot/**"
      - "dependabot/**"
      - "pre-commit-ci-update-config"
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
name: Test C++
jobs:
  testcc:
    name: Test C++
    runs-on: ${{ matrix.check_memleak == false && github.repository_owner == 'deepmodeling' && 'cpu' || 'ubuntu-22.04' }}
    # Paddle's external interface download is occasionally unavailable. Keep
    # exercising these configurations without making that outage blocking.
    continue-on-error: ${{ matrix.enable_paddle }}
    strategy:
      # An allowed Paddle failure must not cancel the other backend jobs.
      fail-fast: false
      matrix:
        # Only regular jobs run the LAMMPS tests. Use self-hosted CPU runners
        # for those jobs in deepmodeling, with a hosted fallback for forks.
        include:
          - check_memleak: true
            enable_tensorflow: true
            enable_pytorch: true
            enable_paddle: false
          - check_memleak: true
            enable_tensorflow: false
            enable_pytorch: false
            enable_paddle: true
          - check_memleak: false
            enable_tensorflow: true
            enable_pytorch: true
            enable_paddle: false
          - check_memleak: false
            enable_tensorflow: false
            enable_pytorch: false
            enable_paddle: true
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential
        if: ${{ matrix.check_memleak == false && github.repository_owner == 'deepmodeling' }}
      # PT2 fixtures and TorchInductor caches contain native code. PyTorch
      # documents AOTInductor packages as non-portable, so scope cache reuse
      # to the CPU ISA, libc, and compiler of the current runner. Do not key
      # on CPU model name: hosted runners may expose the same ISA on different
      # processor models, which would otherwise prevent safe warm-cache reuse.
      - name: Compute native cache fingerprint
        id: native-cache
        if: matrix.enable_pytorch
        shell: bash
        run: |
          {
            echo "arch=$(uname -m)"
            lscpu | sed -n -e 's/^Flags:[[:space:]]*/flags=/p' -e 's/^Features:[[:space:]]*/features=/p'
            echo "glibc=$(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -n1)"
            if command -v c++ >/dev/null 2>&1; then
              echo "cxx=$(c++ -dumpfullversion -dumpversion 2>/dev/null || c++ --version | head -n1)"
            else
              echo "cxx=missing"
            fi
          } > "${RUNNER_TEMP}/native-cache-env.txt"
          cat "${RUNNER_TEMP}/native-cache-env.txt"
          fingerprint=$(sha256sum "${RUNNER_TEMP}/native-cache-env.txt" | cut -c1-16)
          # Hash only inputs that can affect the generated PT/PT2/JAX fixtures.
          # In particular, do not hash the whole source/ tree: unrelated C++
          # tests or backend changes should not invalidate these artifacts.
          source_fingerprint=$(git ls-files -s -- \
            uv.lock pyproject.toml \
            source/install/test_cc_local.sh \
            'source/tests/infer/gen_*.py' \
            'source/tests/infer/*.yaml' \
            'source/tests/infer/*.pth' \
            'deepmd/*.py' \
            deepmd/dpmodel deepmd/pt deepmd/pt_expt deepmd/jax \
            deepmd/infer deepmd/utils deepmd/backend \
            source/op/pt \
            | sha256sum | cut -c1-16)
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "source_fingerprint=${source_fingerprint}" >> "${GITHUB_OUTPUT}"
      - name: Cache generated PyTorch C++ fixtures
        id: pt-fixture-cache
        if: matrix.enable_pytorch
        uses: actions/cache@v6
        with:
          path: |
            source/tests/infer/*.pth
            source/tests/infer/*.pt2
            source/tests/infer/*.pte
            source/tests/infer/*.expected
            source/tests/infer/*.savedmodel
            source/tests/infer/.pt-fixture-cache-manifest
          key: pt-cxx-fixtures-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.fingerprint }}-py311-${{ matrix.check_memleak && 'lsan' || 'regular' }}-${{ steps.native-cache.outputs.source_fingerprint }}
      - name: Cache TorchInductor
        if: matrix.enable_pytorch
        uses: actions/cache@v6
        with:
          path: .cache/torchinductor
          key: torchinductor-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.fingerprint }}-py311-${{ matrix.check_memleak && 'lsan' || 'regular' }}-${{ steps.native-cache.outputs.source_fingerprint }}
      - name: Validate cached multi-backend fixtures
        if: ${{ matrix.enable_pytorch && steps.pt-fixture-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          for fixture in \
            source/tests/infer/fparam_aparam.savedmodel \
            source/tests/infer/fparam_aparam_default.savedmodel \
            source/tests/infer/chg_spin.savedmodel; do
            if [ ! -d "${fixture}" ]; then
              echo "ERROR: cached generated fixture is missing: ${fixture}" >&2
              exit 1
            fi
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: lukka/get-cmake@latest
      - run: python -m pip install uv
      - name: Install Python dependencies
        run: |
          source/install/uv_with_retry.sh pip install --system --group pin_tensorflow_cpu --group pin_pytorch_cpu --group pin_jax_cpu --torch-backend cpu
          export TENSORFLOW_ROOT=$(python -c 'import importlib.util,pathlib;print(pathlib.Path(importlib.util.find_spec("tensorflow").origin).parent)')
          export PYTORCH_ROOT=$(python -c 'import torch;print(torch.__path__[0])')
          source/install/uv_with_retry.sh pip install --system -e .[cpu,test,lmp,jax,torch] mpi4py mpich
        env:
          DP_ENABLE_PYTORCH: 1
      - name: Convert models
        run: source/tests/infer/convert-models.sh
      # https://github.com/actions/runner-images/issues/9491
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28
        if: ${{ matrix.check_memleak }}
      - run: |
          source/install/test_cc_local.sh
        env:
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
          CMAKE_GENERATOR: Ninja
          CXXFLAGS: ${{ matrix.check_memleak && '-fsanitize=leak' || '' }}
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/workflows/suppr.txt
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow && 'TRUE' || 'FALSE' }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch && 'TRUE' || 'FALSE' }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle && 'TRUE' || 'FALSE' }}
          DP_REUSE_GENERATED_PT_MODELS: ${{ steps.pt-fixture-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          TORCHINDUCTOR_CACHE_DIR: ${{ github.workspace }}/.cache/torchinductor
          TORCHINDUCTOR_FX_GRAPH_CACHE: 1
          TORCHINDUCTOR_AUTOGRAD_CACHE: 1
      # test_cc_local.sh creates the base manifest after generation. Add the
      # TorchScript files too before actions/cache saves the cold-run cache;
      # otherwise a cache hit skips gen_spin.py with deeppot_dpa_spin.pth absent.
      - name: Complete PyTorch fixture cache manifest
        if: ${{ matrix.enable_pytorch && steps.pt-fixture-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          manifest=source/tests/infer/.pt-fixture-cache-manifest
          for fixture in source/tests/infer/*.pth; do
            [ -f "${fixture}" ] && basename "${fixture}"
          done >> "${manifest}"
          LC_ALL=C sort -u -o "${manifest}" "${manifest}"
          echo "Cached fixture manifest now contains $(wc -l < "${manifest}") files"
      # test lammps
      - run: |
          cp ${{ github.workspace }}/source/build_tests/paddle_inference_install_dir/paddle/lib/*.so ${{ github.workspace }}/dp_test/lib/
          cp ${{ github.workspace }}/source/build_tests/paddle_inference_install_dir/third_party/install/onednn/lib/* ${{ github.workspace }}/dp_test/lib/
          cp ${{ github.workspace }}/source/build_tests/paddle_inference_install_dir/third_party/install/mklml/lib/* ${{ github.workspace }}/dp_test/lib/
        if: matrix.enable_paddle
      - run: |
          export LD_LIBRARY_PATH=${{ github.workspace }}/dp_test/lib:$LD_LIBRARY_PATH
          source/install/retry_on_sigterm.sh 3 pytest --cov=deepmd source/lmp/tests
        env:
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
          LAMMPS_PLUGIN_PATH: ${{ github.workspace }}/dp_test/lib/deepmd_lmp
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow && '1' || '0' }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch && '1' || '0' }}
          ENABLE_JAX: ${{ matrix.enable_tensorflow && '1' || '0' }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle && '1' || '0' }}
        if: ${{ !matrix.check_memleak }}
      # test ipi
      - run: |
          export PATH=${{ github.workspace }}/dp_test/bin:$PATH
          pytest --cov=deepmd source/ipi/tests
        env:
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
          LD_LIBRARY_PATH: ${{ github.workspace }}/dp_test/lib
          ENABLE_TENSORFLOW: ${{ matrix.enable_tensorflow && '1' || '0' }}
          ENABLE_PYTORCH: ${{ matrix.enable_pytorch && '1' || '0' }}
          ENABLE_JAX: ${{ matrix.enable_tensorflow && '1' || '0' }}
          ENABLE_PADDLE: ${{ matrix.enable_paddle && '1' || '0' }}
        if: ${{ !matrix.check_memleak }}
      - name: Upload coverage to Codecov (non-blocking)
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          use_oidc: true
    permissions:
      id-token: write
  pass:
    name: Pass testing C++
    needs: [testcc]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
