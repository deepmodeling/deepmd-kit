version: 2
build:
  os: ubuntu-26.04
  tools:
    python: "3.11"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      # RTD's current PyTorch headers require C++20 on Ubuntu 26.04.
      - CMAKE_ARGS=-DCMAKE_CXX_STANDARD=20 VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv pip install -r doc/requirements.txt
  apt_packages:
    - inkscape
sphinx:
  configuration: doc/conf.py
